name: Fetch Class Action Claims

on:
  schedule:
    - cron: "0 13 * * *" # Runs daily at 13:00 UTC (8:00 AM EST)
  workflow_dispatch: # Allows manual "Run workflow" clicks in GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run claim fetcher
        run: python scripts/fetch_claims.py

      - name: Commit updated claims feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claims_feed.json
          if git diff --staged --quiet; then
            echo "No changes to claims_feed.json"
          else
            git commit -m "chore: update claims feed"
            git push
          fi
